schema_version: "0.1"

# SSOT for "what we promise the system does". One row per new typed contract
# surface. DESIGN of later features runs `nwave-ai outcomes check-delta`
# against this file to catch duplicate contracts before they are built.
#
# Rows below were written by hand during DISTILL of `guild-key-integrity`
# (2026-07-31): `nwave-ai outcomes register` fails in the installed version
# with FileNotFoundError on its own bundled
# `docs/product/outcomes/schema.json`, which is missing from the wheel. The
# shape matches nwave_ai/outcomes/adapters/yaml_registry.py::_to_outcome, so
# the CLI can read these rows even though it could not write them.
#
# DESIGN ran `check-delta` against the then-empty registry and reported
# "0 outcomes checked" — a vacuous pass, recorded as such at the time. These
# five rows are what make the next feature's check mean something.

outcomes:

  - id: OUT-1
    kind: specification
    summary: >-
      Classify one reading of a guild key into exactly one of five outcomes.
      Collapsing any two of them is a documented failure mode: mismatch vs
      unreachable quarantines the cluster during a vendor outage; mismatch vs
      unverifiable quarantines it on a vendor schema change.
    feature: guild-key-integrity
    inputs:
      - shape: "raw /api/v1/guild response or transport error"
      - shape: "stored GuildIdentity binding, possibly absent"
    output:
      shape: "ProbeOutcome in {match, mismatch, unverifiable, unreachable, dead}"
    keywords: [guild, key, identity, probe, classification, tacticus]
    artifact: bot/services/tacticus/guild_client.py
    related: []

  - id: OUT-2
    kind: invariant
    summary: >-
      A guild api_key is read only by the policy chokepoint and the two
      repository adapters. No cog and no service reads it directly. Seven call
      sites across three cogs plus a service route through one place; a guard
      on six of seven is a silent contamination path.
    feature: guild-key-integrity
    inputs:
      - shape: "the bot/ source tree"
    output:
      shape: "pass, or the list of modules reading api_key outside the sanctioned set"
    keywords: [chokepoint, api_key, architecture, enforcement, boundary]
    artifact: tests/acceptance/guild-key-integrity/test_architecture_chokepoint.py
    related: [OUT-3]

  - id: OUT-3
    kind: invariant
    summary: >-
      A quarantined guild writes zero rows — no battle hits, no bomb hits, no
      player inserts, updates or is_former flips — until a key resolving to
      its bound identity is installed. Holds under every interleaving of
      probes and key updates, not only the enumerated ones.
    feature: guild-key-integrity
    inputs:
      - shape: "guild key_status plus any sequence of probe outcomes and key updates"
    output:
      shape: "row counts unchanged while key_status = quarantined"
    keywords: [quarantine, ingestion, contamination, invariant, state-machine]
    artifact: tests/acceptance/guild-key-integrity/tier_b/test_key_status_state_machine.py
    related: [OUT-2, OUT-4]

  - id: OUT-4
    kind: operation
    summary: >-
      Replace a guild Tacticus key from Discord in one command, probing the
      SUBMITTED key before storing it, without deleting any dependent row.
      Replaces a procedure that required stopping the service, backing up the
      database and running a hand-written script.
    feature: guild-key-integrity
    inputs:
      - shape: "guild_id: str, api_key: str, force: bool = False"
    output:
      shape: "ephemeral reply naming the resolved GuildIdentity; key and hmac written in one transaction, or refused"
    keywords: [update_guild_key, key-rotation, admin, slash-command, recovery]
    artifact: bot/cogs/admin_cog.py
    related: [OUT-3]

  - id: OUT-5
    kind: invariant
    summary: >-
      Quarantining one guild never stops another. Season discovery skips
      guilds without a usable key and falls through to the next; a server with
      no usable key is skipped with a stated reason rather than a silent
      continue.
    feature: guild-key-integrity
    inputs:
      - shape: "guilds dict for one discord_server_id, in iteration order, with mixed key_status"
    output:
      shape: "season resolved from the first usable key; auto_update.cycle records total/processed/skipped/reasons"
    keywords: [season, spof, blast-radius, auto_update, fall-through]
    artifact: bot/cogs/tasks_cog.py
    related: [OUT-3]

  # -------------------------------------------------------------------------
  # Feature `dynamic-tier-registry` — DISTILL 2026-08-15.
  #
  # Written by hand for the reason the header gives: `nwave-ai outcomes
  # register` still fails on its own missing bundled schema.json.
  #
  # DESIGN ran `check-delta` against this file and it exited 0 while reporting
  # "1 outcomes checked, 0 collisions found across 0 outcomes" — a VACUOUS
  # pass: the five rows above never loaded. The collision check was therefore
  # performed by hand and recorded in ADR-009. Two related links came out of
  # it and are set below: OUT-8 shares OUT-2's chokepoint-invariant SHAPE
  # while guarding a different concept, and OUT-9 shares OUT-5's
  # skip-with-a-stated-reason shape at a different grain (entries, not guilds).
  #
  # Neither is a duplicate. Sharing a shape is what a pattern IS — ADR-001,
  # ADR-008 and ADR-009 are deliberately the same shape three times — and
  # collapsing them would lose the thing each one actually guards.
  # -------------------------------------------------------------------------

  - id: OUT-6
    kind: specification
    summary: >-
      Derive a stored tier key from a raid result. Any tier index within a
      tracked rarity produces a key; the rarity allow-list stays closed. The
      previous rule enumerated seven keys and silently discarded anything else,
      which destroyed every Mythic 3 hit from the day the game shipped the tier
      until the day this landed.
    feature: dynamic-tier-registry
    inputs:
      - shape: "raw Tacticus entry with `rarity` and `set`"
    output:
      shape: "tier key string, or None with a stated reason for the caller to count"
    keywords: [tier, parse, rarity, ingest, leaderboard, tacticus]
    artifact: bot/tiers.py
    related: []

  - id: OUT-7
    kind: specification
    summary: >-
      Derive a display label from a stored tier key, and an order from the key
      set. Total: a key with no derivable label renders as itself rather than
      being hidden. Stored keys are frozen, so labels reproduce today's strings
      exactly — including the off-by-one between key and label, which is a bug
      that is deliberately preserved because replay rows are keyed by the LABEL.
    feature: dynamic-tier-registry
    inputs:
      - shape: "stored tier key, registered or not"
    output:
      shape: "Tier(value, name) — structurally compatible with app_commands.Choice[str]"
    keywords: [tier, label, ordering, display, override, replay]
    artifact: bot/tiers.py
    related: [OUT-6]

  - id: OUT-8
    kind: invariant
    summary: >-
      Raid tier names appear in exactly one module. Every other file derives
      them. Adding a tier is therefore one edit in one file, asserted on every
      test run rather than reviewed at the next tier addition — which may be a
      year away. The rule exempts the permission-tier paths by name, because
      `tier` names two unrelated concepts and a rule that fires on correct code
      gets ignored.
    feature: dynamic-tier-registry
    inputs:
      - shape: "the bot/ source tree plus config.py"
    output:
      shape: "pass, or the list of modules naming a tier outside the registry"
    keywords: [chokepoint, tier, architecture, enforcement, boundary, single-source]
    artifact: tests/acceptance/dynamic-tier-registry/test_architecture_tier_literals.py
    related: [OUT-2]

  - id: OUT-9
    kind: invariant
    summary: >-
      Every discarded raid result is counted under a stated reason, and the
      total discarded equals the sum of the per-reason counts. A count that
      exceeds its reasons means a path exists that discards a result without
      naming itself. All reasons are emitted even at zero — an absent counter
      is indistinguishable from one nobody built, which is how the original
      defect stayed invisible.
    feature: dynamic-tier-registry
    inputs:
      - shape: "one ingest pass over a Tacticus entry list"
    output:
      shape: "entries_skipped == sum(entry_skip_counts.values()), all reasons present"
    keywords: [skip, reason, counter, observability, ingest, invariant]
    artifact: bot/tracker.py
    related: [OUT-5]

  - id: OUT-10
    kind: invariant
    summary: >-
      The always-on leaderboard sends exactly one message per tier, ever, and
      deletes nothing. Holds across every interleaving of refresh, season
      rollover, tier registration and refused send — not only the enumerated
      orderings. A second send for one tier orphans the first, permanently and
      publicly, in a channel every guild member reads.
    feature: dynamic-tier-registry
    inputs:
      - shape: "remembered message ids x registered tiers x stored season, under any command sequence"
    output:
      shape: "one send per tier; deleted set empty"
    keywords: [live-board, reconciliation, idempotent, additive, state-machine, duplicate]
    artifact: tests/acceptance/dynamic-tier-registry/tier_b/test_live_board_state_machine.py
    related: [OUT-7]

  - id: OUT-11
    kind: operation
    summary: >-
      Offer the tier picker from the registry unioned with the tiers actually
      present in stored data, so a tier the game ships needs no code edit, no
      redeploy and no command re-sync. Never observed-alone, so one malformed
      row cannot define the tier list and a tier can be selected before its
      first hit lands. Unmatched text is refused by name, never with an empty
      board.
    feature: dynamic-tier-registry
    inputs:
      - shape: "typed prefix, plus SELECT DISTINCT tier_key and the registry"
    output:
      shape: "at most 25 matching Tier labels; a submitted label resolves to a stored key or is refused"
    keywords: [autocomplete, picker, tier, discovery, slash-command, union]
    artifact: bot/cogs/view_cog.py
    related: [OUT-6, OUT-7]
