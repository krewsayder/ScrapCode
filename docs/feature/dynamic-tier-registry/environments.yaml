# environments.yaml — feature `dynamic-tier-registry` (DEVOPS wave, 2026-08-15)
#
# Consumed by DISTILL for Mandate 4 (Environmental Realism). DISTILL
# parametrizes acceptance scenarios over `target_environments`.
#
# As in `guild-key-integrity`, these are Python runtime + data states of one
# Discord bot process, NOT OS installs. Platform is one Linux VM under systemd
# (DEVOPS D1/D2); there is no CI (D3); dev work happens on WSL2 and macOS.
#
# The distinguishing variables here are four, and every environment below is a
# distinct combination of them:
#   (a) what the Tacticus payload carries  — `rarity` in/out of the allow-list,
#       `set` in/out of the historical range, `set` malformed
#   (b) whether the resulting tier key is KNOWN to the registry
#   (c) what the live-leaderboard `messages` map already holds
#   (d) which repository backend is bound (sqlite / json rollback)
#
# ADR-009 D1 (rarity allow-list closed, `set` bound removed) is the rule those
# combinations are testing. The single most important pairing is (a)+(b): a
# payload that parses into a key the registry cannot label is the standing
# `undisplayable` condition (ADR-009 D5), and it is the one state the feature
# must report rather than resolve.
#
# See feature-delta.md `## Wave: DEVOPS / [REF] Environment Matrix`.

target_environments:

  - name: known-tiers-only
    description: |
      The steady state, and the environment that must stay SILENT. Every
      entry in the payload carries a rarity in the allow-list and a `set`
      inside the historical range, so it parses to one of the seven
      pre-existing keys (Legendary_0..4, Mythic, Mythic_1).

      Required behaviour: rows written exactly as they are today; NO skip
      line in the update-channel post; NO `undisplayable` line; every
      per-reason skip counter emits as 0 rather than being absent.

      This is the regression environment. A suite that only covers Mythic 3
      will not catch an implementation that reports a skip on every cycle,
      and AC-002.3 exists precisely because an operator who learns to scroll
      past a routine warning will scroll past the real one.
    platform: [linux, wsl, macos]
    preconditions:
      - "SCRAPCODE_REPO_BACKEND=sqlite"
      - "payload contains only rarity in {Legendary, Mythic} with set in the historical range"
      - "alembic_version equals the compiled head (UNCHANGED by this feature — no new revision)"
    exercises: [US-001, US-002, AC-001.4, AC-002.3, TK-5]

  - name: mythic-3-live
    description: |
      THE INCIDENT REPLAY. Real entries with `rarity="Mythic", set=2` — the
      payload shape the operator confirmed on 2026-08-15, and the one that
      `get_tier_key` currently answers `None` for, causing
      `process_api_response` to `continue` past it (tracker.py:109-111).

      Slice 01 behaviour: the entry parses to `Mythic_2`, a real `battle_hits`
      row is written, and the hand-written `Mythic 3` choice makes the board
      readable the same day.
      Slice 02 behaviour: unchanged user-visible outcome, but the choice is
      now DERIVED. That the operator sees nothing new is how the derivation
      is known to be right.
      Slice 03 behaviour: the live board gains a Mythic 3 message on the next
      hourly refresh.

      Acceptance for this environment is against real cluster data, not a
      synthetic `set=2` fixture. A fixture proves the parser, which was never
      in doubt.
    platform: [linux, wsl, macos]
    preconditions:
      - "SCRAPCODE_REPO_BACKEND=sqlite"
      - "a real season containing genuine rarity=Mythic set=2 entries from a registered guild"
      - "battle_hits.tier_key is String(32); 'Mythic_2' is 8 chars — no truncation risk"
    exercises: [US-001, US-003, US-005, AC-001.5, AC-003.5, TK-1, TK-2, TK-3]

  - name: tier-beyond-the-registry
    description: |
      The residual state the feature reports rather than fixes. A payload
      carries `rarity="Mythic", set=3` — a tier the game has not shipped, and
      which no registry entry labels.

      Required behaviour (ADR-009 D5): the entry is CAPTURED (Slice 01
      generalises the `set` bound, so `Mythic_3` is written), and the
      update-channel post carries
      `📥 Captured but not displayable: Mythic_3 — {n} hits` as a STANDING
      condition re-evaluated each cycle. NOT a first-sighting announcement:
      announce-once needs persisted state to de-duplicate a condition that is
      self-clearing by construction.

      After Slice 02 this state becomes close to unreachable (the derivation
      rule labels any well-formed key). After Slice 04 it is unreachable for
      selection too, because the picker unions the registry with observed
      keys. It stays in the matrix because "close to unreachable" is not
      "impossible", and the whole feature exists because an unreachable-in-
      theory branch swallowed production data.
    platform: [linux, wsl, macos]
    preconditions:
      - "SCRAPCODE_REPO_BACKEND=sqlite"
      - "payload contains rarity=Mythic with set=3 (or any set above the highest registry entry)"
      - "the registry has NO entry for the resulting key"
    exercises: [US-002, US-006, AC-002.4prime, AC-002.5prime, AC-006.1, DDD-6]

  - name: untracked-rarity
    description: |
      The over-generalisation guard. The payload carries entries with a rarity
      OUTSIDE the allow-list — `Epic`, `Rare`, `Uncommon`, `Common` as four
      parametrized cases over one environment.

      Required behaviour: the entry is NOT ingested (ADR-009 D1 keeps the
      rarity allow-list closed), the `untracked_rarity` counter increments,
      and the observed rarity string is carried VERBATIM into the record and
      the post. AC-007.3 rate-limits to once per cycle per rarity so routine
      Epic volume cannot bury a genuinely novel rarity string.

      Removing the `set` bound fixes a bug. Removing the rarity allow-list
      would change what the leaderboard MEANS, which is a product decision and
      not one an ingest parser gets to make. This environment is the assertion
      that Slice 01 did the first and not the second.
    platform: [linux, wsl, macos]
    preconditions:
      - "SCRAPCODE_REPO_BACKEND=sqlite"
      - "payload contains at least one entry per untracked rarity string"
      - "row counts for battle_hits / bomb_hits asserted UNCHANGED for those entries"
    exercises: [US-001, US-007, AC-001.7, AC-007.1, AC-007.3, TK-5]

  - name: malformed-set
    description: |
      Hostile payload on the field the parser now trusts more than it used to.
      Four parametrized cases: `set` absent, `set: null`, `set: "two"`,
      `set: -1`.

      Required behaviour: each is counted under its OWN reason —
      `malformed_set` for a present-but-unusable value, `unparseable` for a
      shape the parser cannot even reach — and NEVER collapsed into a single
      total. TK-5's target of 0% reasonless discards is not met by a counter
      that says "3 skipped" without saying why.

      Kept separate from `untracked-rarity` deliberately. They share an
      outcome (nothing written) and differ in the only thing TK-5 measures
      (the stated reason), so an environment that merged them would pass
      against an implementation with one counter and no reasons.
    platform: [linux, wsl, macos]
    preconditions:
      - "SCRAPCODE_REPO_BACKEND=sqlite"
      - "payload contains one entry per malformed-set case, all with rarity=Mythic"
      - "entries_skipped == sum(entry_skip_counts.values()) asserted — the TK-5 invariant"
    exercises: [US-001, US-002, AC-001.6, AC-002.1, AC-002.2, TK-5]

  - name: live-board-incomplete
    description: |
      Slice 03's target state. A live-leaderboard config exists and its
      `messages` map holds IDs for some tiers but not all — specifically not
      for a tier that IS in the registry and DOES have stored rows.

      Today `_refresh_live_leaderboards` skips any tier lacking a stored
      message_id (tasks_cog.py:663-666) while the season-rollover branch sends
      a full set (tasks_cog.py:684). The observable consequence is that a new
      tier appears weeks later, unprompted — which reads as a bug that fixed
      itself and teaches the operator nothing about when to expect it.

      Required behaviour: same-season reconciliation sends the missing
      message, persists its ID, and does so in registry order. Additive only
      (ADR-009 D8) — a tier absent from the registry keeps its board frozen in
      place rather than having it deleted.

      BOTH live config shapes are in scope and must be parametrized:
      `guild:{id}` and `cluster`.
    platform: [linux, wsl, macos]
    preconditions:
      - "SCRAPCODE_REPO_BACKEND=sqlite"
      - "live leaderboard config present with a messages map missing >= 1 registry tier"
      - "stored rows exist for the missing tier"
      - "parametrized over config shapes: guild:{id} AND cluster"
      - "a SECOND refresh is run and asserted to send nothing (AC-005.2)"
    exercises: [US-005, AC-005.1, AC-005.2, AC-005.4, AC-005.5, TK-3, DDD-8]

  - name: live-board-rollover-race
    description: |
      The public-failure environment. A season rollover and a newly registered
      tier fall in the SAME cycle.

      `config["messages"]` is rewritten wholesale on the rollover path
      (tasks_cog.py:701). A reconciliation branch that races that rewrite
      duplicates the entire board — visibly, in a channel every guild member
      reads, not in a log only the operator sees.

      Required behaviour: exactly ONE set of messages. Rollover and
      reconciliation must not both fire for the same tier in the same cycle.

      This is the environment whose scenarios should be written FIRST in
      Slice 03, not last. Its failure mode is the only one in the feature that
      is worse than the bug being fixed.
    platform: [linux, wsl, macos]
    preconditions:
      - "SCRAPCODE_REPO_BACKEND=sqlite"
      - "season number advances in the same cycle in which a registry tier lacks a message_id"
      - "message count in the channel asserted EXACTLY once per registry tier afterwards"
    exercises: [US-005, AC-005.6, DDD-8]

  - name: discord-send-refused
    description: |
      Partial failure on the reconciliation send, which under rate limiting is
      the NORMAL case rather than an edge case. Three parametrized cases:
      `discord.Forbidden`, `discord.HTTPException` 429, and a send that
      succeeds at Discord but whose local persist step then fails.

      Required behaviour: existing message IDs are retained UNCHANGED, the
      cycle retries next hour, and the retry does NOT duplicate. A
      best-effort partial write of the `messages` map that omits an
      already-sent message is what produces the duplicate — so the
      requirement is retain-unchanged, not write-what-we-got.

      The third case is the honest one and the reason a mocked channel cannot
      substitute here: the failure shape is a real Discord send SUCCEEDING
      after local state has already concluded it failed.
    platform: [linux, wsl, macos]
    preconditions:
      - "SCRAPCODE_REPO_BACKEND=sqlite"
      - "discord.Forbidden / HTTPException(429) injected at the channel.send boundary"
      - "third case: send returns a real message, then the config persist raises"
      - "stored messages map asserted BYTE-IDENTICAL after the failed cycle"
    exercises: [US-005, AC-005.3, TK-3]

  - name: historical-replay-labels
    description: |
      ADR-009 D4's entire bet, as an environment. Replay rows in storage are
      keyed by DISPLAY LABEL, not by tier value (replay_cog.py:208 writes
      `"tier": tier.name`), and rendering filters on that label
      (replay_cog.py:54).

      Required behaviour: after the registry lands, an existing `"Mythic 1"`
      replay is STILL returned by `/get_replay`. A derivation that produces
      "Mythic I" or "Mythic-1" orphans every historical replay from the
      command while leaving the rows in the database — which is the exact
      failure shape the feature exists to eliminate, reproduced in a new
      place.

      This environment is a STORED-LABEL precondition, not a payload one,
      which is why it is not folded into any of the ingest environments. It
      is also why no Alembic revision is needed: nothing is rewritten.
    platform: [linux, wsl, macos]
    preconditions:
      - "replay rows exist keyed by the current display labels ('Mythic 1', 'Legendary 3', ...)"
      - "registry-derived TIER_CHOICES asserted byte-identical in name, value AND order to the current literal list"
      - "/get_replay asserted to return the pre-existing rows after the registry lands"
    exercises: [US-003, US-004, AC-003.2, AC-004.6, DDD-4]

  - name: picker-at-the-cap
    description: |
      Discord permits at most 25 choices per command option. Today's list has
      seven entries and a hand-written eighth arrives in Slice 01, so the cap
      is far away — but a derived list has no author to notice when it is
      crossed, and a command sync that exceeds it is REJECTED BY DISCORD
      rather than failing locally.

      Required behaviour (Slice 02): the process refuses to start, loudly,
      when the derived TIER_CHOICES would exceed 25. A silently rejected
      command sync leaves the OLD choice list live in Discord while the new
      code runs — the two disagree, and nothing anywhere says so.

      Synthetic by necessity (the game has not shipped 25 tiers) and
      structural in value: it is the guard on the failure mode that the whole
      Slice 04 autocomplete migration exists to make impossible.
    platform: [linux, wsl, macos]
    preconditions:
      - "registry seeded with > 25 tier entries"
      - "startup asserted to REFUSE (non-zero exit -> systemd `failed`), not to warn and continue"
    exercises: [US-003, AC-003.6, AC-006.5]

  - name: json-backend-rollback
    description: |
      ADR-006 D9 degradation, and the environment the operator lands in if a
      slice has to be rolled back under time pressure.

      Slices 01-03: NO repository change is made, so this backend must behave
      exactly as it does today. The parser generalisation, the counters and
      the reconciliation are all above the repository boundary.

      Slice 04 is different and is the deployment hazard in this feature.
      DDD-9 adds `list_tier_keys` to the `ClusterRepository` ABC. An abstract
      method added to the ABC makes JsonClusterRepository UNINSTANTIABLE until
      it implements it — which would break the rollback path itself, at
      process start, with a TypeError. Both adapters ship the method in the
      same commit or neither does.

      Required behaviour: the parametrized repository contract suite stays
      green against this adapter across all four slices, and the bot starts
      cleanly.
    platform: [linux, wsl, macos]
    preconditions:
      - "SCRAPCODE_REPO_BACKEND=json"
      - "clusters/ JSON tree present"
      - "Slice 04 only: JsonClusterRepository implements list_tier_keys; instantiation asserted"
      - "parametrized repository contract suite run against this adapter"
    exercises: [AC-006.6, ADR-006-D9, DDD-9]

coexistence_matrix:

  - tool: systemd
    must_not_break: true
    note: |
      The `discord-bot` unit is the deploy mechanism. Recreate strategy —
      `systemctl restart discord-bot`. Unchanged from the sqlite-backend and
      guild-key-integrity waves.

      Slice 02's cap refusal and Slice 04's command-sync failure must both
      surface as a `failed` unit, not be masked by `Restart=always`.

  - tool: alembic
    must_not_break: true
    note: |
      THIS FEATURE ADDS NO REVISION. ADR-009 D4 freezes stored tier keys and
      derives labels instead, so `battle_hits.tier_key` and
      `bomb_hits.tier_key` keep every value they hold and no column changes.

      The consequence is operationally significant and worth stating plainly:
      the ADR-006 probe refuses to start on ANY inequality between the DB's
      alembic_version and the compiled head, in BOTH directions
      (bot/db/session.py:224). With the head unchanged, the
      "migrate-before-restart / downgrade-before-checkout" ordering hazard —
      recorded in guild-key-integrity's matrix as the most likely operational
      mistake in that feature — DOES NOT APPLY to any slice here. Deploy is a
      checkout and a restart; rollback is the previous checkout and a restart.

  - tool: discord-bot-backup.timer
    must_not_break: true
    note: |
      CORRECTED 2026-08-15. This note previously read "Status CHANGED since
      the guild-key-integrity wave: `scripts/backup-db.sh` now exists in the
      repository (commit fa072f4, 2026-08-14)". It did, on a branch, and that
      branch was discarded on 2026-08-15 along with the script. Nothing in the
      repository provides a backup today.

      The gap is therefore UNCHANGED from what guild-key-integrity's matrix
      recorded: no backup script, and a systemd timer that was never installed.
      Both halves are open.

      Recorded as a correction rather than by deleting the paragraph, because
      "we wrote a backup script" and "we have a backup" are different claims
      and this file briefly conflated them. A DEVOPS artifact asserting a
      control that does not exist is the failure mode this project has already
      hit three times.

      For THIS feature that gap is not release-blocking, and saying otherwise
      would be borrowing urgency from the wrong wave: with no migration, the
      backup is not the rollback path for any slice here. It stays in the
      matrix as an unrelated standing gap the operator should close, not as a
      gate on Slice 01 — and Slice 01 is the slice where every hour of delay
      destroys data that cannot be recovered.

  - tool: import-linter
    must_not_break: true
    note: |
      Six contracts live in pyproject.toml [tool.importlinter]. ONE IS ADDED
      by this feature: `bot.tiers` must not import discord, config,
      bot.guilds, bot.repository*, bot.db, sqlalchemy, or aiosqlite —
      ADR-009 D2's purity constraint, enforced in the same shape as the
      existing `bot.obs stays dependency-free` contract.

      Note the direction: `config.py` imports `bot.tiers` (TIER_CHOICES is
      derived from it), never the reverse. `config.py` keeps its own `discord`
      import and wraps the registry's Tier records into Choice objects. That
      is what keeps the rule table free of the event loop and testable without
      one.

  - tool: pytest-archon
    must_not_break: true
    note: |
      Pinned into requirements.txt by guild-key-integrity DEVOPS D10 and used
      by tests/acceptance/guild-key-integrity/test_architecture_chokepoint.py.

      This feature adds a sibling AST assertion: the literals "Mythic_" and
      "Legendary_" appear ONLY in bot/tiers.py and its own tests. That test is
      the TK-4 instrument (see kpi-contracts.yaml) and carries the
      permission-tier exemption from ADR-009 D10 — `tier.value` in fun_cog.py
      and admin_cog.py:734,736 names a PERMISSION tier (member/officer/admin),
      not a raid tier, and a rule that does not exempt them by name would
      either fail on correct code or teach the operator to ignore it.

  - tool: pytest
    must_not_break: true
    note: |
      `pytest tests/unit tests/acceptance` is THE gate (no CI — DEVOPS D3).
      The combined invocation resolves rootdir to the repo root and reads
      [tool.pytest.ini_options] in pyproject.toml, which supplies
      asyncio_mode=auto. The new suite lands at
      tests/acceptance/dynamic-tier-registry/ beside the two existing
      acceptance suites.

  - tool: pip-venv
    must_not_break: true
    note: |
      /opt/discord-bot/.venv is reused. NO NEW DEPENDENCY is introduced by any
      slice — DESIGN's Technology Choices table records `none`, and that holds
      through Slice 04 (autocomplete is discord.py, already present).
      `pip install -r requirements.txt` on deploy is therefore a no-op for
      this feature.

  - tool: discord-api
    must_not_break: true
    note: |
      TWO distinct concerns, one per phase.

      Slices 01-03 use @app_commands.choices, which is fixed at command-sync
      time and capped at 25 per option. The Slice 02 startup refusal is the
      guard.

      Slice 04 changes the `tier` option's TYPE (Choice[str] -> str +
      autocomplete) on four commands. That requires a command tree re-sync,
      and a re-sync is the one deploy step in this feature that can fail
      SILENTLY: the process starts, the old choice list stays live in Discord,
      and the running code expects a free-text value. Post-deploy verification
      for Slice 04 must invoke each of the four commands, not merely confirm
      the process is up.

      Autocomplete also fires PER KEYSTROKE. `SELECT DISTINCT tier_key` is
      small today and unbounded in principle (DESIGN Open Question 3);
      measure before adding a cache.

  - tool: pre-commit
    must_not_break: true
    note: |
      NOT installed (no .pre-commit-config.yaml, no hook in .git/hooks).
      Deliberately not introduced — guild-key-integrity DEVOPS D10 settled
      this: a hook needs `pre-commit install` per clone and is bypassable with
      --no-verify, so it would be strongest on the operator's laptop and
      absent where the code lands.

  - tool: husky
    must_not_break: true
    note: "Not installed; same coexistence contract as pre-commit if added."

platform_coverage:
  Linux:
    - "Ubuntu 22.04 LTS (production VM, discord-bot-vm)"
    - "Ubuntu 24.04 LTS (acceptable upgrade target)"
  WSL:
    - "WSL2 on Windows 11 (primary dev environment)"
  macOS:
    - "macOS 14+ (secondary dev environment)"
  Python:
    - "3.11 (matches the VM venv)"
    - "3.13 (local dev)"
  CI:
    - "None (DEVOPS D3, re-verified 2026-08-15: no .github/ directory exists). Stages 1-3 are CI-portable unchanged if added."

deployment_assumptions:

  - "NO ALEMBIC REVISION, NO SCHEMA CHANGE, NO DATA REWRITE. ADR-009 D4 freezes stored tier keys. Deploy is `git checkout && systemctl restart`; rollback is the same in reverse. This is the first feature since sqlite-backend for which the migration-ordering hazard does not apply at all."

  - "NO NEW DEPENDENCY, NO NEW ENV VAR, NO NEW SECRET, NO NEW PORT, NO NEW EXTERNAL SYSTEM. Call volume against the Tacticus API is unchanged — the same responses are fetched; fewer entries are thrown away."

  - "IDEMPOTENT: re-running a cycle over already-ingested entries changes nothing (the UNIQUE constraint on (boss_id, encounter_index, tier_key, ...) already governs this). Re-running a live-board refresh after reconciliation sends nothing (AC-005.2)."

  - "SLICE 01 SHIPS ALONE AND FIRST, WITHOUT WAITING FOR THE REST. Every hourly cycle before it lands permanently destroys that hour's Mythic 3 hits — the Tacticus guild-raid endpoint serves a rolling window and cannot be backfilled. Batching Slice 01 with Slice 02 to get a tidier release buys a documentation aesthetic at the cost of a day of unrecoverable data."

  - "NO SOAK GATE. guild-key-integrity D11 required a 7-day soak because its Slice 01 observed a condition that its Slice 03 then acted on DESTRUCTIVELY (quarantine). Nothing in this feature is destructive: reconciliation is additive-only (D8), stored keys are frozen (D4), and the worst outcome of a wrong derivation is a mislabelled board. Importing a soak gate here would delay Slice 01 for a risk shape this feature does not have."

  - "SLICE 02 DELETES SLICE 01's HAND-WRITTEN `Mythic 3` CHOICE and replaces it with the derived entry. That eighth entry is therefore a REGRESSION SURFACE on a picker the operator is by then already using, and AC-003.2's byte-identity pin as written covers only the first seven. Post-deploy verification for Slice 02 must confirm Mythic 3 is still selectable. See devops/upstream-changes.md item 2."

  - "SLICE 04 REQUIRES A COMMAND TREE RE-SYNC and is the only slice whose deploy can fail silently. Verify by invoking /view_leaderboard, /view_bomb_leaderboard, /view_cluster_leaderboard and /upload_replay after restart — not by confirming the unit is active."

  - "SLICE 04's ABC CHANGE IS ALL-OR-NOTHING ACROSS BOTH ADAPTERS. `list_tier_keys` added to ClusterRepository makes JsonClusterRepository uninstantiable until it implements it. Shipping the ABC change without the JSON implementation breaks the documented SCRAPCODE_REPO_BACKEND=json rollback path at process start."

  - "EVERY SKIP COUNTER EMITS EVEN WHEN ZERO. `entry_skip_counts` always carries all three reason keys. An absent key is indistinguishable from an unimplemented counter, and a discard nobody counted is the precise defect this feature was opened to fix."

  - "A FAILED DEPLOY AUTO-STOPS RATHER THAN HALF-RUNS. Inherited from ADR-006 D8, unchanged. Slice 02's >25-choice refusal joins the existing startup refusals."
