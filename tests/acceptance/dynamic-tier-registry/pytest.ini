[pytest]
# Acceptance suite for the `dynamic-tier-registry` feature (DISTILL wave).
# Same shape as tests/acceptance/sqlite-backend/ and
# tests/acceptance/guild-key-integrity/: plain pytest + pytest-asyncio, NO
# pytest-bdd. The .feature files under acceptance/ are the human-readable
# scenario SSOT; the test modules beside them are the executable specs.
# Recorded as a project convention in docs/architecture/atdd-infrastructure-policy.md.
asyncio_mode = auto
# Worktree root (3 levels up) so `import bot.*` resolves at collection time.
pythonpath = . ../../..
testpaths = .
# Only collect test_*.py — never try to parse the .feature files as Python.
python_files = test_*.py
addopts = -ra
markers =
    slice_01: Slice 01 — capture every tier, report what was skipped
    slice_02: Slice 02 — the tier registry, and Mythic 3 on every view command
    slice_03: Slice 03 — live boards reconcile toward the current tier set
    slice_04: Slice 04 — the tier picker discovers tiers
    real_io: exercises a real adapter (SQLite, JSON tree, alembic)
    adapter_integration: crosses a driven-adapter boundary with real I/O
    driving_port: entered through a user-facing surface, not an internal call
    error: an error or edge path
    kpi: asserts an outcome-KPI instrument from docs/product/kpi-contracts.yaml
    property: property-based / state-machine test (Tier B)
    traceability: asserts a doc artifact and the suite have not drifted apart
    architecture: an enforcement rule about the source tree, not about behaviour
