[pytest]
# Acceptance suite for the `cluster-board-control` feature (DISTILL wave).
# Same shape as tests/acceptance/{sqlite-backend,guild-key-integrity}/: plain
# pytest + pytest-asyncio, no pytest-bdd. The .feature files under acceptance/
# are the human-readable scenario SSOT; these test modules are the executable
# specs. Convention recorded in docs/architecture/atdd-infrastructure-policy.md.
asyncio_mode = auto
# Worktree root (3 levels up) so `import bot.*` resolves at collection time.
pythonpath = . ../../..
testpaths = .
# Only collect test_*.py — never try to parse the .feature files as Python.
python_files = test_*.py
addopts = -ra
markers =
    slice_01: Slice 01 — the operator off switch + its conformance precursor
    real_io: exercises a real adapter (SQLite, JSON tree, alembic)
    adapter_integration: crosses a driven-adapter boundary with real I/O
    driving_port: entered through a user-facing surface, not an internal call
    error: an error or edge path
    kpi: asserts an outcome-KPI instrument from docs/product/kpi-contracts.yaml
    property: property-based / state-machine test (Tier B)
    infrastructure: the US-004 conformance precursor — no user-visible change
