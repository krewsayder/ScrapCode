[pytest]
# Acceptance suite for the `guild-key-integrity` feature (DISTILL wave).
# Same shape as tests/acceptance/sqlite-backend/: plain pytest +
# pytest-asyncio, no pytest-bdd. The .feature files under acceptance/ are the
# human-readable scenario SSOT; these test modules are the executable specs.
asyncio_mode = auto
# Worktree root (3 levels up) so `import bot.*` resolves at collection time.
pythonpath = . ../../..
testpaths = .
# Only collect test_*.py — never try to parse the .feature files as Python.
python_files = test_*.py
addopts = -ra
markers =
    slice_01: Slice 01 — bind and report identity (non-blocking)
    slice_02: Slice 02 — /update_guild_key (the recovery path)
    slice_03: Slice 03 — quarantine enforcement
    slice_04: Slice 04 — survive hostile vendor output (remediation; RED by design)
    slice_05: Slice 05 — close the write holes (remediation; RED by design)
    slice_06: Slice 06 — admin command safety (remediation; RED by design)
    slice_07: Slice 07 — composition-root integrity (remediation; RED by design)
    real_io: exercises a real adapter (SQLite, JSON tree, alembic, subprocess)
    adapter_integration: crosses a driven-adapter boundary with real I/O
    driving_port: entered through a user-facing surface, not an internal call
    error: an error or edge path
    kpi: asserts an outcome-KPI instrument from docs/product/kpi-contracts.yaml
    requires_external: needs the live Tacticus service and a real key; skipped
        unless SCRAPCODE_TACTICUS_CONTRACT_KEY is set
    property: property-based / state-machine test (Tier B)
    traceability: asserts a doc artifact and the suite have not drifted apart
